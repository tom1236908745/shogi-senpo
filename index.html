<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>将棋戦法ドリル</title>
<meta name="description" content="将棋の戦法を、相手の作戦別バリエーションとクエスト形式で覚える">
<meta name="theme-color" content="#27365f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="戦法ドリル">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
img{max-width:100%}[hidden]{display:none!important}
html,body{touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: home (strategies) → strategy (variations grouped by opponent setup) → lesson (quest bar on top, board with piece stands, commentary) */
:root{
  --bg:#e9ebe6; --surface:#f7f8f4; --fg:#1d2230; --muted:#5d6472; --line:#cfd3cb;
  --ink:#27365f; --ink-soft:#dfe3ee; --shu:#b5432a; --ok:#2e7a4d; --ok-soft:#dcefe2;
  --kaya:#e2b867; --kaya-2:#d6a653; --stand:#c99a52; --stand-2:#b8873f; --grid:#5b3e17;
  --koma:#f4dfad; --koma-2:#e9cf92; --koma-edge:#a87b3a; --koma-ink:#1a1408; --koma-pr:#b11d0f;
  --hl-last:rgba(181,67,42,.22); --hl-sel:rgba(39,54,95,.30); --hl-dot:rgba(39,54,95,.55);
  --f-koma:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171c; --surface:#1e2128; --fg:#e8e5dd; --muted:#a2a6b0; --line:#30343d;
  --ink:#9fb2ea; --ink-soft:#262c3d; --shu:#e07a5f; --ok:#6cc08f; --ok-soft:#1d3127;
  --kaya:#b98d47; --kaya-2:#a97d3b; --stand:#8f6a33; --stand-2:#7c5a29; --grid:#3a280f;
  --koma:#ead39d; --koma-2:#dcc086; --koma-edge:#8a6328; --koma-ink:#1a1408; --koma-pr:#a3170b;
  --hl-last:rgba(224,122,95,.35); --hl-sel:rgba(159,178,234,.40); --hl-dot:rgba(30,40,80,.65);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171c; --surface:#1e2128; --fg:#e8e5dd; --muted:#a2a6b0; --line:#30343d;
  --ink:#9fb2ea; --ink-soft:#262c3d; --shu:#e07a5f; --ok:#6cc08f; --ok-soft:#1d3127;
  --kaya:#b98d47; --kaya-2:#a97d3b; --stand:#8f6a33; --stand-2:#7c5a29; --grid:#3a280f;
  --koma:#ead39d; --koma-2:#dcc086; --koma-edge:#8a6328; --koma-ink:#1a1408; --koma-pr:#a3170b;
  --hl-last:rgba(224,122,95,.35); --hl-sel:rgba(159,178,234,.40); --hl-dot:rgba(30,40,80,.65);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit}
.btn{font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.btn.ghost{background:none;border-color:transparent;padding-inline:6px}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen{animation:rise .25s ease-out both;display:grid;gap:16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;max-width:260px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.lv{font-size:.7rem;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 6px;white-space:nowrap}

/* home */
.hero h1{font-family:var(--f-koma);font-weight:900;font-size:clamp(1.8rem,6vw,2.4rem);margin:0;color:var(--ink);letter-spacing:.04em}
.hero p{margin:2px 0 0;color:var(--muted);max-width:60ch}
.total{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.group h2{font-size:.78rem;letter-spacing:.14em;color:var(--muted);margin:6px 0 8px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:grid;gap:6px}
.card:hover{border-color:var(--ink)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-family:var(--f-koma);font-weight:900;font-size:1.3rem;margin:0}
.card p{margin:0;font-size:.85rem;color:var(--muted)}
.card .prog{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card .prog .bar{max-width:none}
.card.clear{border-color:var(--ok)}
.badge{color:var(--ok);font-weight:700}

/* strategy */
.shead{display:grid;gap:4px}
.shead .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shead h1{font-family:var(--f-koma);font-weight:900;font-size:1.9rem;margin:0;color:var(--ink)}
.shead p{margin:0;color:var(--muted);max-width:60ch;font-size:.9rem}
.vgroup{display:grid;gap:8px}
.vgroup h2{margin:0;font-family:var(--f-koma);font-weight:900;font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--grid);padding-bottom:3px}
.vgroup h2 small{font-family:var(--f-ui);font-weight:400;font-size:.72rem;color:var(--muted)}
.vrow{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:12px 14px 12px 0;cursor:pointer;overflow:hidden}
.vrow:hover{border-color:var(--ink)}
.vrow .stripe{align-self:stretch;background:var(--line)}
.vrow.part .stripe{background:var(--ink)}
.vrow.clear .stripe{background:var(--ok)}
.vrow b{font-size:1rem;display:block}
.vrow span.d{font-size:.82rem;color:var(--muted);display:block}
.vrow .st{font-size:.75rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;display:grid;gap:2px;justify-items:end}

/* lesson */
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lhead h1{font-family:var(--f-koma);font-weight:900;font-size:1.4rem;margin:0}
.lhead .sub{font-size:.78rem;color:var(--muted)}
.quest{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.steps{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:2px 2px 4px}
.step{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
  font-size:.82rem;font-weight:700;color:var(--muted);background:var(--bg);padding:0;font-variant-numeric:tabular-nums}
.step.done{background:var(--ok);border-color:var(--ok);color:var(--surface);cursor:pointer}
.step.now{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}
.step.done.now{color:var(--surface);box-shadow:0 0 0 3px var(--ok-soft)}
.step.final{border-radius:8px;width:auto;padding:0 10px}
.link{flex:0 0 14px;height:2px;background:var(--line)}
.link.done{background:var(--ok)}
.mission{display:grid;gap:4px}
.mlabel{font-size:.72rem;letter-spacing:.14em;color:var(--ink);font-weight:700}
.mtitle{font-family:var(--f-koma);font-weight:900;font-size:1.25rem;margin:0;display:flex;align-items:center;gap:8px;height:1.7em;white-space:nowrap;overflow:hidden}
.mtitle .t{overflow:hidden;text-overflow:ellipsis}
.mgoal{margin:0;color:var(--muted);font-size:.9rem;max-width:60ch}
/* fixed-height rows so the quest panel never changes size between phases (keeps the board still) */
.mission .mgoal{min-height:3.2em}
.mactions{display:flex;gap:8px;flex-wrap:nowrap;margin-top:6px;align-items:center;height:40px;overflow:hidden}
.mactions .btn{white-space:nowrap}
.check{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--surface);font-size:.9rem;flex:0 0 auto}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.check.pop{animation:pop .35s ease-out}
.mission.cleared .mlabel{color:var(--ok)}
.doneline{color:var(--ok);font-weight:700;font-size:.9rem;white-space:nowrap}

.main{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}}
.boardcol{display:grid;gap:8px;min-width:0}
/* piece stands */
.stand{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 10px;border-radius:4px;
  background:linear-gradient(180deg,var(--stand),var(--stand-2));box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.stand.gote{flex-direction:row-reverse}
.stand .who{font-size:.72rem;font-weight:700;color:var(--koma-ink);background:var(--koma);border-radius:3px;padding:1px 6px;white-space:nowrap;flex:0 0 auto}
.stand .pcs{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.stand.gote .pcs{justify-content:flex-end}
.stand .empty{font-size:.75rem;color:var(--koma-ink);opacity:.6}
.hp{position:relative;width:34px;height:38px;border:0;background:none;padding:0;flex:0 0 auto;cursor:default;-webkit-tap-highlight-color:transparent}
.hp .koma{inset:0}
.hp.can{cursor:pointer}
.hp.sel{outline:3px solid var(--ink);outline-offset:1px;border-radius:4px}
.hp.hint{outline:3px solid var(--shu);outline-offset:1px;border-radius:4px}
.hp .n{position:absolute;right:-5px;bottom:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--surface);
  font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px;line-height:1}
.stand.gote .hp .n{right:auto;left:-5px;top:-4px;bottom:auto}
.boardframe{--cw:36px;--ch:39px;display:grid;grid-template-columns:auto 18px;grid-template-rows:auto auto;justify-content:start;gap:2px 4px;padding:10px 6px 10px 10px;
  background:linear-gradient(160deg,var(--kaya),var(--kaya-2));border-radius:4px;box-shadow:0 8px 22px -12px rgba(60,40,10,.5);
  -webkit-user-select:none;user-select:none}
.files{grid-column:1;display:grid;grid-template-columns:repeat(9,var(--cw));column-gap:1px;padding-inline:2px;font-size:.7rem;color:var(--grid);text-align:center;line-height:1.4}
.ranks{grid-column:2;grid-row:2;display:grid;grid-template-rows:repeat(9,var(--ch));row-gap:1px;font-size:.7rem;color:var(--grid);align-items:center;justify-items:center;font-family:var(--f-koma);padding-block:2px}
/* grid lines = 1px gaps over the line color; cell sizes are whole pixels (set in JS) so every line renders at the same width */
.board{grid-column:1;grid-row:2;display:grid;grid-template-columns:repeat(9,var(--cw));grid-template-rows:repeat(9,var(--ch));gap:1px;border:2px solid var(--grid);background:var(--grid)}
.sq{position:relative;border:0;background:var(--kaya);padding:0;margin:0;min-width:0;min-height:0;overflow:hidden;
  cursor:default;font-size:0;line-height:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-appearance:none;appearance:none;border-radius:0}
.board.play .sq{cursor:pointer}
.sq.last{background:linear-gradient(var(--hl-last),var(--hl-last)),var(--kaya)}
.sq.sel{background:linear-gradient(var(--hl-sel),var(--hl-sel)),var(--kaya)}
.sq.hint{box-shadow:inset 0 0 0 3px var(--shu)}
.sq.tg::after{content:"";position:absolute;left:37%;top:37%;width:26%;height:26%;border-radius:50%;background:var(--hl-dot)}
.sq.tg.cap::after{left:8%;top:8%;width:84%;height:84%;background:none;border:3px solid var(--hl-dot)}
.koma{position:absolute;inset:5% 7% 4%;pointer-events:none;background:linear-gradient(180deg,var(--koma),var(--koma-2));clip-path:polygon(50% 0,86% 16%,100% 100%,0 100%,14% 16%);
  display:grid;place-items:center;font-family:var(--f-koma);font-weight:900;color:var(--koma-ink);font-size:calc(var(--cw) * .58);line-height:1;padding-top:14%;
  filter:drop-shadow(0 1px 0 var(--koma-edge))}
.hp .koma{font-size:19px}
.koma.g{transform:rotate(180deg)}
.koma.pr{color:var(--koma-pr)}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.board.shake{animation:nudge .25s 2}
.side{display:grid;gap:14px;min-width:0}
.movebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;min-height:130px}
.moverow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mv{font-family:var(--f-koma);font-weight:900;font-size:1.4rem}
.count{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.comment{margin:0;max-width:60ch}
.fb{font-weight:700;font-size:.9rem;min-height:1.4em}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--shu)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.notes{grid-template-columns:1fr}}
.notes h3{font-size:.78rem;letter-spacing:.12em;margin:0 0 4px;color:var(--ink)}
.notes .warn h3{color:var(--shu)}
.notes ul{margin:0;padding-left:1.1em;font-size:.88rem}
.notes li+li{margin-top:4px}
.kifu{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.8rem;color:var(--muted)}
.kifu b{color:var(--fg)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.cat h2{font-family:var(--f-koma);font-weight:900;font-size:1.05rem;margin:4px 0 8px;color:var(--fg);border-bottom:1px solid var(--grid);padding-bottom:3px}
.sidepill{font-size:.7rem;font-weight:700;border-radius:3px;padding:0 6px;background:var(--ink-soft);color:var(--ink);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.screen,.check.pop,.board.shake{animation:none}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
// ---- engine ----
const KANJI={K:'玉',R:'飛',B:'角',G:'金',S:'銀',N:'桂',L:'香',P:'歩'};
const PROM={R:'龍',B:'馬',S:'全',N:'圭',L:'杏',P:'と'};
const RANKS='〇一二三四五六七八九';
const FW='０１２３４５６７８９';
function initPos(){
  const b={};const put=(f,r,t,s)=>{b[f*10+r]={t,s,p:false};};
  const back=['L','N','S','G','K','G','S','N','L'];
  for(let f=1;f<=9;f++){put(f,9,back[f-1],0);put(f,1,back[f-1],1);put(f,7,'P',0);put(f,3,'P',1);}
  put(8,8,'B',0);put(2,8,'R',0);put(2,2,'B',1);put(8,2,'R',1);
  return {b,h:[{},{}],turn:0};
}
function clonePos(p){const b={};for(const k in p.b)b[k]={...p.b[k]};return {b,h:[{...p.h[0]},{...p.h[1]}],turn:p.turn};}
function pathClear(b,ff,fr,tf,tr){
  const sf=Math.sign(tf-ff),sr=Math.sign(tr-fr);let f=ff+sf,r=fr+sr;
  while(f!==tf||r!==tr){if(b[f*10+r])return false;f+=sf;r+=sr;}return true;
}
function canReach(pos,from,to){
  const pc=pos.b[from];if(!pc||from===to)return false;
  const tf=Math.floor(to/10),tr=to%10;if(tf<1||tf>9||tr<1||tr>9)return false;
  const tgt=pos.b[to];if(tgt&&tgt.s===pc.s)return false;
  const ff=Math.floor(from/10),fr=from%10;const dx=tf-ff,dxa=Math.abs(dx);
  const rel=(tr-fr)*(pc.s===0?-1:1),ra=Math.abs(rel);
  const king=Math.max(dxa,ra)===1;
  const gold=(rel===1&&dxa<=1)||(rel===0&&dxa===1)||(rel===-1&&dxa===0);
  const t=pc.t;
  if(pc.p&&'SNLP'.includes(t))return gold;
  switch(t){
    case 'P':return rel===1&&dx===0;
    case 'L':return dx===0&&rel>0&&pathClear(pos.b,ff,fr,tf,tr);
    case 'N':return rel===2&&dxa===1;
    case 'S':return (rel===1&&dxa<=1)||(rel===-1&&dxa===1);
    case 'G':return gold;
    case 'K':return king;
    case 'R':return ((dx===0||rel===0)&&pathClear(pos.b,ff,fr,tf,tr))||(pc.p&&king);
    case 'B':return (dxa===ra&&pathClear(pos.b,ff,fr,tf,tr))||(pc.p&&king);
  }return false;
}
function dropTargets(pos,t,side){const out=[];for(let f=1;f<=9;f++){let nifu=false;if(t==='P')for(let r=1;r<=9;r++){const q=pos.b[f*10+r];if(q&&q.t==='P'&&!q.p&&q.s===side)nifu=true;}
  for(let r=1;r<=9;r++){const rr=side===0?r:10-r;if(pos.b[f*10+r])continue;if((t==='P'||t==='L')&&rr===1)continue;if(t==='N'&&rr<=2)continue;if(nifu)continue;out.push(f*10+r);}}return out;}
function targets(pos,from){const out=[];for(let f=1;f<=9;f++)for(let r=1;r<=9;r++)if(canReach(pos,from,f*10+r))out.push(f*10+r);return out;}
function parseMove(m){
  const [core,suf]=m.split('|');
  if(core[1]==='*')return {drop:core[0],to:+core.slice(2,4),suf:suf||''};
  return {from:+core.slice(0,2),to:+core.slice(2,4),prom:core.endsWith('+'),suf:suf||''};
}
function pieceName(pc){return pc.p?PROM[pc.t]:(pc.t==='K'&&pc.s===1?'王':KANJI[pc.t]);}
function applyMove(pos,m,prevTo){
  const mv=parseMove(m);const p=clonePos(pos);const side=p.turn;let name,err=null;
  if(mv.drop){
    if(!p.h[side][mv.drop])err='no piece in hand';
    if(p.b[mv.to])err='occupied';
    if(mv.drop==='P'){const f=Math.floor(mv.to/10);for(let r=1;r<=9;r++){const q=p.b[f*10+r];if(q&&q.t==='P'&&!q.p&&q.s===side)err='nifu';}}
    p.h[side][mv.drop]--;if(!p.h[side][mv.drop])delete p.h[side][mv.drop];
    p.b[mv.to]={t:mv.drop,s:side,p:false};name=KANJI[mv.drop];
  }else{
    const pc=p.b[mv.from];
    if(!pc)err='no piece at '+mv.from;else if(pc.s!==side)err='wrong side';else if(!canReach(pos,mv.from,mv.to))err='illegal';
    if(err)return {err};
    name=pieceName(pc);
    const cap=p.b[mv.to];if(cap){p.h[side][cap.t]=(p.h[side][cap.t]||0)+1;}
    delete p.b[mv.from];p.b[mv.to]={...pc,p:pc.p||mv.prom};
  }
  if(err)return {err};
  p.turn=1-side;
  const f=Math.floor(mv.to/10),r=mv.to%10;
  const sq=prevTo===mv.to?'同':FW[f]+RANKS[r];
  const label=(side===0?'▲':'△')+sq+name+mv.suf+(mv.prom?'成':'');
  return {pos:p,label,from:mv.from||null,to:mv.to,drop:!!mv.drop,dropT:mv.drop||null};
}
function buildLesson(L){
  const states=[initPos()],labels=[],info=[];let prevTo=null;
  for(const [m] of L.moves){
    const res=applyMove(states[states.length-1],m,prevTo);
    if(res.err)throw new Error(L.id+' move '+(labels.length+1)+' '+m+': '+res.err);
    states.push(res.pos);labels.push(res.label);info.push(res);prevTo=res.to;
  }
  return {states,labels,info};
}

function castle(o){
  const moves=[],stages=[];let gi=0;const fill=o.fill||FILL[o.f];
  (o.pre||[]).forEach(m=>moves.push(typeof m==='string'?[m,'']:m));
  o.steps.forEach(([title,goal,list])=>{
    list.forEach((m,i)=>{
      if(moves.length%2===1){moves.push([fill[gi++],'']);}
      moves.push(typeof m==='string'?[m,'']:m);
    });
    stages.push([title,goal,moves.length]);
  });
  return {...o,moves,stages,kind:'castle'};
}
// Strategy lessons: interleaved moves with '#title|goal' stage markers.
function strat(o){
  const moves=[],stages=[];let pend=null;const side=o.side||0;
  const userEnd=e=>((e-1)%2===side)?e:e-1;   // a mission always ends on the learner's own move
  o.flat.forEach(m=>{
    if(typeof m==='string'&&m[0]==='#'){if(pend)stages.push([pend[0],pend[1],userEnd(moves.length)]);pend=m.slice(1).split('|');return;}
    moves.push(typeof m==='string'?[m,'']:m);
  });
  if(pend)stages.push([pend[0],pend[1],userEnd(moves.length)]);
  if(stages.length&&stages[stages.length-1][2]!==moves.length)moves.length=stages[stages.length-1][2];
  return {...o,moves,stages};
}

function fitBoard(){

  fr.style.setProperty('--cw',cw+'px');fr.style.setProperty('--ch',Math.round(cw*12/11)+'px');
  const extra=avail-cw*9;fr.style.paddingLeft=(10+Math.floor(extra/2))+'px';fr.style.paddingRight=(6+Math.ceil(extra/2))+'px';  // whole-pixel centering
}

function autoOpp(){

  if(phase==='intro')act=`<button class="btn" id="aDemo">お手本を見る</button><button class="btn primary" id="aPlay">${cleared?'もう一度挑戦':'挑戦する'}</button>`;
  else if(phase==='demo')act=`<button class="btn" id="aStop">お手本を止める</button>`;
  else if(phase==='play')act=`<button class="btn" id="aHint">ヒント</button><button class="btn" id="aRetry">やり直す</button>`;
  else if(phase==='fail')act=`<button class="btn primary" id="aPlay">もう一度</button>`;
  else if(phase==='clear'){
    act=mi+1<ms.length?`<span class="doneline">クリア！</span><button class="btn" id="aNext">すぐに進む →</button>`
            :`<button class="btn primary" id="aBack">一覧へ戻る</button><button class="btn" id="aPlay">もう一度</button>`;
  }
  el.className='mission'+(cleared?' cleared':'');
  el.innerHTML=head+`<div class="mactions">${act}</div>`;
  const on=(id,f)=>{const b=$(id);if(b)b.onclick=f;};
  on('aDemo',playDemo);on('aPlay',startPlay);on('aRetry',startPlay);on('aNext',nextMission);on('aBack',()=>openCard(curCard));
  on('aStop',()=>{clearTimer();phase='intro';idx=m.start;fb='';render();});
  on('aHint',()=>{hint=true;hintUsed=true;fb='赤枠の駒を動かそう（持ち駒のこともある）。';fbc='';renderBoard();renderInfo();});
}
function komaEl(promoted,flip,name){
  const s=document.createElement('span');s.className='koma'+(flip?' g':'')+(promoted?' pr':'');s.textContent=name;return s;
}
function renderHand(pos,side,el){
  const h=pos.h[side],B=built[cur],m=missions(cur)[mi],mine=side===US;
  const exp=(phase==='play'&&idx<m.end)?B.info[idx]:null;
  el.innerHTML=`<span class="who">${side?'△後手':'▲先手'}の持ち駒${mine?'（あなた）':''}</span><span class="pcs"></span>`;
  const pcs=el.querySelector('.pcs');const types='RBGSNLP'.split('').filter(t=>h[t]);
  if(!types.length){pcs.innerHTML='<span class="empty">なし</span>';return;}
  types.forEach(t=>{
    const b=document.createElement('button');b.type='button';b.className='hp';
    b.setAttribute('aria-label',`${side?'後手':'先手'}の持ち駒 ${KANJI[t]} ${h[t]}枚`);
    b.appendChild(komaEl(false,!mine,KANJI[t]));
    if(h[t]>1){const n=document.createElement('span');n.className='n';n.textContent=h[t];b.appendChild(n);}
    if(mine&&phase!=='demo'){b.classList.add('can');b.onclick=()=>onHand(t);}else b.tabIndex=-1;
    if(mine&&sel==='h:'+t)b.classList.add('sel');
    if(mine&&hint&&exp&&exp.drop&&exp.dropT===t)b.classList.add('hint');
    pcs.appendChild(b);
  });
}
function selTargets(pos){
  if(!sel)return [];
  if(typeof sel==='string')return dropTargets(pos,sel.slice(2),US);
  return targets(pos,sel);
}
function renderBoard(){
  const B=built[cur],pos=B.states[idx],board=$('board');
  const last=idx>0?B.info[idx-1]:null,tg=selTargets(pos);
  const m=missions(cur)[mi];const hintSq=(phase==='play'&&hint&&idx<m.end)?B.info[idx].from:null;
  board.classList.toggle('play',phase==='play');board.innerHTML='';
  for(let i=0;i<9;i++)for(let j=0;j<9;j++){
    const r=US?9-i:1+i,f=US?1+j:9-j;
    const k=f*10+r,pc=pos.b[k],d=document.createElement('button');
    d.className='sq';d.type='button';let lab=FW[f]+RANKS[r];
    if(last&&(last.to===k||last.from===k))d.classList.add('last');
    if(sel===k)d.classList.add('sel');
    if(tg.includes(k)){d.classList.add('tg');if(pc)d.classList.add('cap');}
    if(hintSq===k)d.classList.add('hint');
    if(pc){d.appendChild(komaEl(pc.p,pc.s!==US,pieceName(pc)));lab+=(pc.s?' 後手':' 先手')+pieceName(pc);}
    d.setAttribute('aria-label',lab);if(phase!=='play')d.tabIndex=-1;
    d.onclick=()=>onSq(k);board.appendChild(d);
  }
  renderHand(pos,1-US,$('handTop'));renderHand(pos,US,$('handBot'));
}
function renderInfo(){
  const B=built[cur],L=VARS[cur],n=B.info.length;
  $('mv').textContent=idx?B.labels[idx-1]:'開始局面';
  $('count').textContent=`${idx} / ${n}手`;
  let c='';
  if(phase==='intro')c=US?'あなたは後手（△）。相手の初手のあとに指そう。「お手本を見る」か、自分の駒をタップして挑戦しよう。':'「お手本を見る」で手順を確認するか、盤上の自分の駒をタップしてそのまま挑戦しよう。';
  else{const oppLast=idx>0&&B.states[idx-1].turn!==US;
       const a=idx>0?L.moves[idx-1][1]:'',b=(idx>1&&oppLast)?L.moves[idx-2][1]:'';
       c=[b,a].filter(Boolean).join(' ')||(oppLast?'（相手の自然な手）':'');}
  $('comment').textContent=c;
  const f=$('fb');f.textContent=fb;f.className='fb '+fbc;
  $('kifu').innerHTML=B.labels.slice(0,idx).map((l,i)=>i===idx-1?`<b>${l}</b>`:`<span>${l}</span>`).join('');
}
function render(){renderSteps();renderMission();renderBoard();renderInfo();}

function ensurePlay(){
  if(phase==='play')return true;
  if(phase==='demo')return false;
  if(phase==='clear'&&mi+1<missions(cur).length){mi++;setupMission();}
  startPlay();return !busy;
}
function shake(){const b=$('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
function tryMove(isDrop,k){
  const B=built[cur],m=missions(cur)[mi],exp=B.info[idx];
  const ok=isDrop?(exp.drop&&exp.dropT===sel.slice(2)&&exp.to===k):(!exp.drop&&exp.from===sel&&exp.to===k);
  if(ok){
    sel=null;hint=false;idx++;fb='正解！';fbc='ok';
    if(idx>=m.end){clearMission();return;}
    render();autoOpp();
  }else{
    miss++;const right=isDrop?(exp.drop&&exp.dropT===sel.slice(2)):(exp.from===sel);sel=null;
    fb=right?'駒は合っています。行き先が違います。':(exp.drop?'その手ではありません。持ち駒を使う場面かも？':'その手ではありません。ミッションの目標を見直そう。');fbc='ng';
    renderBoard();renderInfo();shake();
  }
}
function onHand(t){
  if(!ensurePlay()||busy)return;
  const m=missions(cur)[mi];if(idx>=m.end)return;
  sel=sel==='h:'+t?null:'h:'+t;renderBoard();
}
function onSq(k){
  if(phase!=='play'){
    const p0=built[cur].states[missions(cur)[mi].start].b[k];
    if(!ensurePlay())return;
    const pos=built[cur].states[idx];
    if(!busy&&pos.turn===US&&p0&&p0.s===US&&pos.b[k]){sel=k;renderBoard();}
    return;
  }
  if(busy)return;
  const B=built[cur],m=missions(cur)[mi];if(idx>=m.end)return;
  const pos=B.states[idx],pc=pos.b[k];
  if(sel&&selTargets(pos).includes(k)){tryMove(typeof sel==='string',k);return;}
  sel=(pc&&pc.s===US&&sel!==k)?k:null;renderBoard();
}
const h=location.hash.slice(1);
if(VARS[h])openLesson(h);else if(CARDS[h])openCard(h);else renderHome();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
